id: football-pipeline
name: FanPulse football pipeline
description: Evaluates grounded football observations and meaningful poll decisions from six licensed video windows.
judge_model: foundry-multimodal
grounding:
  name: grounded_observation
  labels:
    - PASS
    - FAIL
  passing_labels:
    - PASS
  instructions: |
    Judge whether the actual observation is consistent with the expected visible scene and avoids every
    forbidden claim. Allow reasonable differences in football terminology. Return PASS only when the
    observation stays within the visible evidence; otherwise return FAIL.
poll_decision:
  name: correct_poll_decision

