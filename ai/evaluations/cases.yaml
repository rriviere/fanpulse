cases:
  - id: routine-midfield-opening
    category: routine
    start_seconds: 5
    expected_visible_event: Ordinary midfield play with teams spread across the pitch and no clearly visible immediate threat.
    expected_poll: false
    forbidden_claims: [goal scored, named player, named team, exact score]

  - id: routine-midfield-build-up
    category: routine
    start_seconds: 170
    expected_visible_event: A midfield build-up or transition without a clearly visible decisive outcome.
    expected_poll: false
    forbidden_claims: [goal scored, named player, named team, exact score]

  - id: significant-attack-near-box
    category: significant
    start_seconds: 50
    expected_visible_event: An attacking sequence developing close to the penalty area with several players involved.
    expected_poll: true
    forbidden_claims: [goal scored, named player, named team, exact score]

  - id: significant-pressure-near-box
    category: significant
    start_seconds: 225
    expected_visible_event: Sustained attacking pressure or a dangerous sequence in or around the penalty area.
    expected_poll: true
    forbidden_claims: [goal scored, named player, named team, exact score]

  - id: ambiguous-distant-defensive-area
    category: ambiguous
    start_seconds: 100
    expected_visible_event: Distant play near the defensive penalty area where the precise action or outcome is not clearly visible.
    expected_poll: false
    forbidden_claims: [goal scored, named player, named team, exact score, confirmed shot]

  - id: ambiguous-goalkeeper-area
    category: ambiguous
    start_seconds: 285
    expected_visible_event: Distant goalkeeper-area play where possession and the exact outcome may be uncertain.
    expected_poll: false
    forbidden_claims: [goal scored, named player, named team, exact score, confirmed save]

