name: Deploy web application

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fanpulse-development-deployment
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.cache/python

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Install and test Python application
        run: |
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pytest apps/api/tests ai/tests -q

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Lint and build web application
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Verify playback and voting synchronization without calling Foundry
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Assemble tested application
        run: |
          mkdir -p package/apps/api package/apps/web package/ai
          printf '%s\n' "${{ github.sha }}" > package/.deployment-revision
          cp requirements.txt package/
          cp apps/api/requirements.txt package/apps/api/
          rsync -a --exclude '__pycache__' --exclude '*.pyc' apps/api/app package/apps/api/
          cp apps/api/__init__.py package/apps/api/
          cp apps/__init__.py package/apps/
          rsync -a \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude 'tests' \
            --exclude 'evaluations' \
            ai/ package/ai/
          cp -R apps/web/dist package/apps/web/
          mkdir -p package/apps/web/dist/media
          python -m pip install \
            --requirement apps/api/requirements.txt \
            --target package/.python_packages/lib/site-packages

      - name: Verify assembled application imports
        run: |
          test -f package/ai/foundry_errors.py
          PYTHONPATH="package/.python_packages/lib/site-packages:package" \
            python -c "from apps.api.app.main import app; assert app"

      - name: Upload tested application artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanpulse-tested-${{ github.sha }}
          path: package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to App Service
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development
      url: ${{ steps.endpoint.outputs.url }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
    steps:
      - name: Download tested application artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fanpulse-tested-${{ github.sha }}
          path: package

      - name: Authenticate to Azure with OIDC
        uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify deployment target
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          az webapp show --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME" --query id --output tsv >/dev/null

      - name: Add licensed match video from private Blob Storage
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
          VIDEO_CONTAINER: ${{ vars.FOOTBALL_VIDEOS_CONTAINER }}
          VIDEO_BLOB_NAME: ${{ vars.FOOTBALL_VIDEO_BLOB_NAME }}
        run: |
          test -n "$STORAGE_ACCOUNT"
          test -n "$VIDEO_CONTAINER"
          test -n "$VIDEO_BLOB_NAME"
          az storage blob download \
            --auth-mode login \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$VIDEO_CONTAINER" \
            --name "$VIDEO_BLOB_NAME" \
            --file package/apps/web/dist/media/match.mov \
            --overwrite true \
            --only-show-errors
          test -s package/apps/web/dist/media/match.mov

      - name: Create immutable deployment package
        run: |
          cd package
          zip -q -r ../fanpulse-${{ github.sha }}.zip .

      - name: Retain final deployment package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanpulse-deployment-${{ github.sha }}
          path: fanpulse-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Start App Service for deployment
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: az webapp start --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME"

      - name: Deploy package to App Service
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          az webapp deploy \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --src-path "fanpulse-${{ github.sha }}.zip" \
            --type zip \
            --clean true \
            --restart true \
            --async false \
            --track-status false \
            --timeout 600000 \
            --deploymentTag "${{ github.sha }}" \
            --only-show-errors

      - name: Resolve application endpoint
        id: endpoint
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          host=$(az webapp show --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME" --query defaultHostName --output tsv)
          echo "url=https://$host" >> "$GITHUB_OUTPUT"

      - name: Verify deployed application without AI inference
        env:
          APP_URL: ${{ steps.endpoint.outputs.url }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          for attempt in {1..40}; do
            health=$(curl --fail --silent --show-error --max-time 20 "$APP_URL/api/health" || true)
            if [[ "$(jq -r '.revision // empty' <<< "$health")" == "$EXPECTED_REVISION" ]] && \
               [[ "$(jq -r '.vision_analysis_ready // false' <<< "$health")" == "true" ]]; then
              echo "$health"
              break
            fi
            echo "Waiting for revision $EXPECTED_REVISION; current health: ${health:-unavailable}"
            if [[ "$attempt" == 40 ]]; then
              echo "Expected application revision did not become healthy" >&2
              exit 1
            fi
            sleep 15
          done
          curl --fail --silent --show-error --max-time 20 "$APP_URL/" >/dev/null
          curl --fail --silent --show-error --max-time 20 \
            "$APP_URL/simulations/reference-match.v1.json" | \
            jq --exit-status '.version == 1 and (.players | length) == 22 and (.events | length) > 0' >/dev/null
          curl --fail --silent --show-error --max-time 20 \
            --range 0-1023 "$APP_URL/media/match.mov" >/dev/null
