name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.cache/python

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Validate declarative Foundry configuration
        run: python -m ai.provision

      - name: Run Python tests
        run: python -m pytest apps/api/tests ai/tests -q

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint web application
        working-directory: apps/web
        run: npm run lint

      - name: Test synthetic motion and playback synchronization
        working-directory: apps/web
        run: npm test

      - name: Build web application
        working-directory: apps/web
        run: npm run build

      - name: Test synthetic playback in Chromium without calling Foundry
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Build Bicep template
        run: az bicep build --file infra/main.bicep --stdout >/dev/null
