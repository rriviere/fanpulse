name: Deploy Foundry solution

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fanpulse-foundry-development
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.cache/python

jobs:
  validate:
    name: Validate declarative solution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install Foundry deployment dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Validate models, agents, schemas, and evaluation assets
        run: |
          python -m ai.provision
          python -m pytest ai/tests/test_configuration.py -q

  publish:
    name: Publish agents and evaluation
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: development
    permissions:
      contents: read
      id-token: write
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_VISION_MODEL_DEPLOYMENT: ${{ vars.FOUNDRY_VISION_MODEL_DEPLOYMENT }}
    steps:
      - name: Check out validated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install Foundry deployment dependencies
        run: python -m pip install -r apps/api/requirements.txt

      - name: Authenticate to Azure with OIDC
        uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify deployment configuration
        run: |
          test -n "$FOUNDRY_PROJECT_ENDPOINT"
          test -n "$FOUNDRY_VISION_MODEL_DEPLOYMENT"
          case "$FOUNDRY_PROJECT_ENDPOINT" in
            https://*.services.ai.azure.com/api/projects/*) ;;
            *) echo "FOUNDRY_PROJECT_ENDPOINT is not a Foundry project endpoint" >&2; exit 1 ;;
          esac

      - name: Publish changed agent versions and evaluation definition
        run: python -m ai.provision --apply

  evaluate:
    name: Run static Foundry evaluation
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: development
    permissions:
      contents: read
      id-token: write
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out published commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install evaluation dependencies
        run: python -m pip install -r apps/api/requirements.txt

      - name: Authenticate to Azure with OIDC
        uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run static Foundry dataset evaluation
        run: python -m ai.evaluations.runner --run

      - name: Retain evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanpulse-evaluation-${{ github.sha }}
          path: ai/evaluations/results
          if-no-files-found: warn
          retention-days: 30
