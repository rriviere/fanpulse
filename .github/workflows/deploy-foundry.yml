name: Deploy Foundry solution

on:
  workflow_dispatch:
    inputs:
      run_evaluation:
        description: Run the billable six-window pipeline evaluation after publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fanpulse-foundry-development
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.cache/python

jobs:
  validate:
    name: Validate declarative solution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install Foundry deployment dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Validate models, agents, schemas, and evaluation assets
        run: |
          python -m ai.provision
          python -m pytest ai/tests/test_configuration.py -q

  publish:
    name: Publish agents and evaluation
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: development
    permissions:
      contents: read
      id-token: write
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_VISION_MODEL_DEPLOYMENT: ${{ vars.FOUNDRY_VISION_MODEL_DEPLOYMENT }}
    steps:
      - name: Check out validated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install Foundry deployment dependencies
        run: python -m pip install -r apps/api/requirements.txt

      - name: Authenticate to Azure with OIDC
        uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify deployment configuration
        run: |
          test -n "$FOUNDRY_PROJECT_ENDPOINT"
          test -n "$FOUNDRY_VISION_MODEL_DEPLOYMENT"
          case "$FOUNDRY_PROJECT_ENDPOINT" in
            https://*.services.ai.azure.com/api/projects/*) ;;
            *) echo "FOUNDRY_PROJECT_ENDPOINT is not a Foundry project endpoint" >&2; exit 1 ;;
          esac

      - name: Publish changed agent versions and evaluation definition
        run: python -m ai.provision --apply

  evaluate:
    name: Run six-window Foundry evaluation
    needs: publish
    if: inputs.run_evaluation == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: development
    permissions:
      contents: read
      id-token: write
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_VISION_MODEL_DEPLOYMENT: ${{ vars.FOUNDRY_VISION_MODEL_DEPLOYMENT }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out published commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install evaluation dependencies
        run: python -m pip install -r apps/api/requirements.txt

      - name: Authenticate to Azure with OIDC
        uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve licensed evaluation video
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
          VIDEO_CONTAINER: ${{ vars.FOOTBALL_VIDEOS_CONTAINER }}
          VIDEO_BLOB_NAME: ${{ vars.FOOTBALL_VIDEO_BLOB_NAME }}
        run: |
          test -n "$STORAGE_ACCOUNT"
          test -n "$VIDEO_CONTAINER"
          test -n "$VIDEO_BLOB_NAME"
          az storage blob download \
            --auth-mode login \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$VIDEO_CONTAINER" \
            --name "$VIDEO_BLOB_NAME" \
            --file apps/web/public/media/match.mov \
            --overwrite true \
            --only-show-errors
          test -s apps/web/public/media/match.mov

      - name: Run real Foundry pipeline evaluation
        run: python -m ai.evaluations.run

      - name: Retain evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fanpulse-evaluation-${{ github.sha }}
          path: ai/evaluations/results
          if-no-files-found: warn
          retention-days: 30
